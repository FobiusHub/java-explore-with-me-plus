services:
  stats-db:
    image: postgres:16.1
    container_name: stats-db
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5460:5432"             # наружный порт не важен для сервисов в сети
    volumes:
      - stats-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stats"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  stats-server:
    build:
      context: .                # ВАЖНО: корень, чтобы Maven видел все модули
      dockerfile: stat_svc/service/Dockerfile
    container_name: stats-server
    depends_on:
      stats-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: "9090"
      # при необходимости:
      # SPRING_SQL_INIT_MODE: always
      # SPRING_JPA_HIBERNATE_DDL_AUTO: none
    ports:
      - "9090:9090"
    restart: unless-stopped

  ewm-db:
    image: postgres:16.1
    container_name: ewm-db
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ewm-service:
    build:
      context: .                # тоже из корня
      dockerfile: ewm_service/Dockerfile
    container_name: ewm-service
    depends_on:
      ewm-db:
        condition: service_healthy
      stats-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: "8080"
      EWM_STATS_URL: http://stats-server:9090
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  stats-data:
